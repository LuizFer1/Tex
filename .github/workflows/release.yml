name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'tex-app').version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match workspace version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: cargo test

      - run: cargo build --release

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\tex.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --draft --title "Tex ${{ steps.version.outputs.version }}" --generate-notes "target\installer\Tex-Setup-${{ steps.version.outputs.version }}.exe"
