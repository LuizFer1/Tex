[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license-file = "LICENSE.md"
publish = false

[workspace.dependencies]
tex-platform = { path = "crates/tex-platform" }
tex-index = { path = "crates/tex-index" }
tex-ipc = { path = "crates/tex-ipc" }
tex-clipboard = { path = "crates/tex-clipboard" }
global-hotkey = "0.8.0"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "system-tray",
    "unstable-winit-030",
] }
slint-build = "1.18.1"
embed-resource = "3.0.5"
windows-sys = "0.59"
windows-service = "0.8.1"
unicode-normalization = "0.1.25"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chacha20poly1305 = "0.11.0"
png = "0.18.1"
libc = "0.2.190"
raw-window-handle = "0.6.2"
x11rb = { version = "0.13.2", features = ["randr"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
serde_json = "1.0.154"
ed25519-dalek = "3.0.0"
sha2 = "0.11"
getrandom = "0.4.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
